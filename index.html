<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>MVB – Magdeburger Verkehrsbetriebe</title>
  <meta name="description" content="Verbindungen, Abfahrten in Echtzeit, interaktives Liniennetz, Störungsmeldungen, Tickets und Karriere bei den Magdeburger Verkehrsbetrieben.">
  <meta name="theme-color" content="#00A04B">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <script>
    /* Hell/Dunkel vor dem ersten Zeichnen setzen (kein Aufblitzen) */
    (function () { try { var p = JSON.parse(localStorage.getItem('mvb.theme')); var d = p ? p === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = d ? 'dark' : 'light'; } catch (e) { document.documentElement.dataset.theme = 'light'; } })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
  <!-- Alle Farben: assets/css/variables.css -->
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <a class="sr" href="#app">Zum Inhalt springen</a>
  <header class="hd" id="hd"></header>
  <main id="app" tabindex="-1"></main>
  <footer class="ft" id="ft"></footer>

  <div class="help" id="help"></div>
  <div class="modal" id="modal" hidden></div>

  <!-- Seitenwechsel: Streifen fädeln ein → Thema → Streifen fädeln aus -->
  <div class="loader is-splash" id="loader" aria-hidden="true">
    <div class="loader__stripes"><i></i><i></i><i></i></div>
    <div class="loader__screen">
      <div class="loader__brand">
        <svg class="loader__logo" viewBox="0 0 300 180" aria-hidden="true">
          <path class="loader__tram" d="M30 40 Q30 20 52 20 L240 20 Q266 22 278 60 L288 110 Q290 124 276 124 L36 124 Q30 124 30 116 Z"/>
          <rect class="loader__win" x="48" y="38" width="44" height="34" rx="5"/><rect class="loader__win" x="106" y="38" width="44" height="34" rx="5"/><rect class="loader__win" x="164" y="38" width="44" height="34" rx="5"/><path class="loader__win" d="M222 38 L250 38 Q262 42 268 72 L222 72 Z"/>
          <path d="M140 20 L128 2 L172 2" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round"/>
          <rect class="loader__rail" x="10" y="140" width="290" height="10" rx="5"/>
        </svg>
        <span class="loader__name" data-loader-name>MVB</span>
      </div>
      <div class="loader__bar"><span></span></div>
      <p class="loader__text">Magdeburger Verkehrsbetriebe</p>
    </div>
  </div>

  <noscript><div class="wrap" style="padding:120px 0"><p>Bitte JavaScript aktivieren, um die Seite der MVB zu nutzen.</p></div></noscript>

  <script src="assets/js/nozoom.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
  <script src="assets/js/core.js"></script>
  <script src="assets/js/lines.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/transit.js"></script>
  <script src="assets/js/maps.js"></script>
  <script src="assets/js/components.js"></script>
  <script src="assets/js/pages.js"></script>
  <script src="assets/js/verbindungen.js"></script>
  <script src="assets/js/karriere.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
